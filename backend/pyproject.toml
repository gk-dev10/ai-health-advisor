[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "body-map-health-advisor-api"
version = "1.0.0"
description = "FastAPI service for the Body Map AI Health Advisor"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "python-dotenv>=1.0,<2.0",
  "google-genai>=1.0,<3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
